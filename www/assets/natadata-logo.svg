<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" width="100%" height="100%">
  <defs>
    <!-- Gradien halus untuk memberikan dimensi 3D pada huruf N -->
    <linearGradient id="nLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#005CE6" />
      <stop offset="100%" stop-color="#006BFF" />
    </linearGradient>
    <linearGradient id="nTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A75FF" />
      <stop offset="100%" stop-color="#0062F5" />
    </linearGradient>
    <linearGradient id="rightBlockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0872FF" />
      <stop offset="100%" stop-color="#0062F5" />
    </linearGradient>
  </defs>

  <!-- Ikon Utama: Huruf N Isometrik & Kubus -->
  <g id="natadata-icon">
    <!-- Kaki Kiri Vertikal Huruf N (Sisi Depan-Kiri) -->
    <path d="M 158 148 
             C 158 142, 162 138, 168 141 
             L 204 162 
             L 204 275 
             C 204 281, 198 284, 193 281 
             L 164 264 
             C 160 261, 158 257, 158 252 Z" 
          fill="url(#nLeftGrad)" />

    <!-- Puncak & Diagonal Huruf N (Sisi Atas-Miring) -->
    <path d="M 161 142 
             C 162 138, 165 135, 169 133 
             L 196 117 
             C 201 114, 207 115, 211 119 
             L 276 196 
             C 279 200, 281 204, 281 209 
             L 281 236 
             C 281 242, 274 245, 269 241 
             L 204 176 
             L 163 152 
             C 159 150, 159 145, 161 142 Z" 
          fill="url(#nTopGrad)" />

    <!-- Blok Vertikal Kanan Atas -->
    <path d="M 281 104 
             C 281 98, 288 95, 293 98 
             L 332 121 
             C 336 123, 338 127, 338 132 
             L 338 196 
             C 338 202, 331 205, 326 202 
             L 287 179 
             C 283 177, 281 173, 281 168 Z" 
          fill="url(#rightBlockGrad)" />

    <!-- Kubus 3D Isometrik (Kanan Bawah) -->
    <g id="isometric-cube">
      <!-- Sisi Atas Kubus -->
      <path d="M 309.5 215 
               L 337.5 231.2 
               L 309.5 247.4 
               L 281.5 231.2 Z" 
            fill="#0872FF" stroke="#0872FF" stroke-width="3" stroke-linejoin="round" />

      <!-- Sisi Kiri Kubus -->
      <path d="M 278.5 236.2 
               L 306.5 252.4 
               L 306.5 284.8 
               L 278.5 268.6 Z" 
            fill="#0062F5" stroke="#0062F5" stroke-width="3" stroke-linejoin="round" />

      <!-- Sisi Kanan Kubus -->
      <path d="M 312.5 252.4 
               L 340.5 236.2 
               L 340.5 268.6 
               L 312.5 284.8 Z" 
            fill="#0066FF" stroke="#0066FF" stroke-width="3" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Teks Tipografi NataData -->
  <text x="250" y="362" 
        text-anchor="middle" 
        font-family="'Inter', 'Montserrat', 'Segoe UI', Arial, sans-serif" 
        font-weight="800" 
        font-size="68" 
        letter-spacing="-1.5">
    <tspan fill="#06194A">Nata</tspan><tspan fill="#0066FF">Data</tspan>
  </text>
</svg>